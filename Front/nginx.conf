server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es CRÍTICO para SPAs con react-router-dom:
        # Redirige cualquier ruta que no sea un archivo físico a index.html
        try_files $uri $uri/ /index.html;
    }

    # Caché óptimo para recursos estáticos (CSS, JS, imágenes, fuentes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Deshabilitar caché para el HTML principal (evita que el usuario cargue versiones viejas al desplegar)
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
